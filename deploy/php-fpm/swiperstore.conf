; Swiper Store — PHP-FPM pool.
; Salin ke /etc/php/8.4/fpm/pool.d/swiperstore.conf lalu restart php8.4-fpm.
; Sesuaikan versi PHP dan socket dengan yang dipasang di server.

[swiperstore]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

request_terminate_timeout = 60s

php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php8.4-fpm/swiperstore-error.log

php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[memory_limit] = 512M
php_admin_value[max_file_uploads] = 5
php_admin_value[max_execution_time] = 60

php_admin_value[session.use_strict_mode] = 1
php_admin_value[session.use_only_cookies] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_samesite] = Lax
php_admin_value[session.gc_maxlifetime] = 604800
