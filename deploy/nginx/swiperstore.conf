# Swiper Store — Nginx site config
#
# 1. Copy to /etc/nginx/sites-available/swiperstore.conf
# 2. Replace swiperstore.example.com with the real domain.
# 3. Create the HTTP-context rate-limit zone in
#    /etc/nginx/conf.d/swiperstore-limits.conf:
#
#      limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
#
# 4. ln -s /etc/nginx/sites-available/swiperstore.conf /etc/nginx/sites-enabled/
# 5. nginx -t && systemctl reload nginx
#
# TLS certificates are issued by certbot (webroot /var/www/certbot).

server {
    listen 80;
    listen [::]:80;
    server_name swiperstore.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name swiperstore.example.com;

    ssl_certificate /etc/letsencrypt/live/swiperstore.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/swiperstore.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Matches the Next.js server-action body limit plus multipart overhead.
    client_max_body_size 10m;

    # Nginx terminates TLS; Next must never trust a client-supplied hop.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 60s;

    # Thumbnails are served from disk, never through Node. shared/storage is
    # the one path that survives release switches.
    location /media/ {
        alias /srv/swiperstore/shared/storage/uploads/;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;

        access_log off;
        autoindex off;
    }

    # Extra throttle in front of the app's own 5-failure limiter.
    location = /admin/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:3000;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ /\. {
        deny all;
    }
}
