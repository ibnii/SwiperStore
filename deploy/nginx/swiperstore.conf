# Swiper Store — Nginx server block.
# Salin ke /etc/nginx/sites-available/swiperstore lalu symlink ke sites-enabled.
# Ganti root, server_name, dan versi php-fpm sesuai server.

server {
    listen 80;
    listen [::]:80;
    server_name swiperstore.example.com;

    root /var/www/swiperstore;
    index index.php;

    server_tokens off;
    client_max_body_size 12m;
    autoindex off;

    # Keamanan dasar.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; frame-src https://www.youtube-nocookie.com https://www.tiktok.com https://drive.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    # Aktifkan HSTS hanya setelah HTTPS berjalan stabil.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # Folder internal tidak boleh diakses langsung.
    location ~ ^/(config|includes|database|cron|deploy|storage)(/|$) {
        return 404;
    }

    location ~ /\.(?!well-known) {
        return 404;
    }

    location ~* \.(md|sql|ini|log|env|sh|dump|tar\.gz)$ {
        return 404;
    }

    # Media publik: hanya WebP dari storage/uploads.
    location ^~ /media/ {
        alias /var/www/swiperstore/storage/uploads/;
        if ($uri !~ \.webp$) {
            return 404;
        }
        expires 30d;
    }

    # Aset statis.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Clean URL.
    rewrite ^/$ /index.php last;
    rewrite ^/api/health$ /health.php last;
    rewrite ^/admin/?$ /admin/index.php last;
    rewrite ^/admin/login$ /auth/login.php last;
    rewrite ^/admin/logout$ /auth/logout.php last;
    rewrite ^/admin/akun/baru$ /admin/tambah.php last;
    rewrite ^/admin/akun/([0-9]+)/edit$ /admin/edit.php?id=$1 last;
    rewrite ^/admin/akun/([0-9]+)/hapus$ /admin/hapus.php?id=$1 last;
    rewrite ^/admin/akun/([0-9]+)/status$ /admin/status.php?id=$1 last;
    rewrite ^/akun/(SWP-[0-9]{4,})/?$ /akun/detail.php?kode=$1 last;

    location / {
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    error_page 404 /404.php;
}
