services:
  postgres:
    image: postgres:16
    container_name: swiperstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: swiperstore
      POSTGRES_USER: swiperstore
      POSTGRES_PASSWORD: swiperstore_dev
    ports:
      - "5433:5432"
    volumes:
      - swiperstore_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swiperstore -d swiperstore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  swiperstore_pgdata:
